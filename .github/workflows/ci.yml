name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  release:
    types: [published]

jobs:
  macos:
    runs-on: macOS-26
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 1
    - name: SPM tests
      run: swift test --enable-code-coverage
    - name: Upload coverage data
      uses: vapor/swift-codecov-action@v0.3.5
      with:
        codecov_token: ${{ secrets.CODECOV_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag:
          - swift:6.2
          - swift:6.3
          - swift:6.4
    container:
      image: ${{ matrix.tag }}
    steps:
    - name: Install curl
      run: apt-get update -yq && apt-get install -y curl
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 1
    - name: Test
      run: swift test --enable-test-discovery --enable-code-coverage --sanitize=thread
    - name: Upload coverage data
      uses: vapor/swift-codecov-action@v0.3.5
      with:
        codecov_token: ${{ secrets.CODECOV_TOKEN }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: compnerd/gha-setup-swift@v0.5.0
        with:
          branch: swift-6.3-release
          tag: 6.3-RELEASE
      - uses: actions/checkout@v7.0.1
      - run: swift test